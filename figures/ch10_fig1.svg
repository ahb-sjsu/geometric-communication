if" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">curvature K = 1 / R²</text><text x="430.00" y="204.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">enclosed area = (π / 2) R²</text><text x="430.00" y="224.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#e8ecf0" text-anchor="start" font-weight="600">rotation = K × area = π / 2 = 90°</text><text x="430.00" y="268.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">flat surface: K = 0, rotation 0</text><text x="430.00" y="310.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8fa4b8" text-anchor="start" font-weight="normal" font-style="italic">grey arrows: the vector on its way round</text></svg>